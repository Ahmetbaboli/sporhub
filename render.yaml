# Render Blueprint for the Just Sport API (real data). Database on Neon, web on Vercel.
# See docs/DEPLOY.md. Secrets are `sync: false` and entered in the Render dashboard.
services:
  - type: web
    name: justsport-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        sync: false # Neon DIRECT (non-pooler) URL as copied; the API adapts it for asyncpg
      - key: REDIS_URL
        sync: false # optional Upstash rediss:// URL; empty = in-process cache
      - key: DATA_MODE
        value: live
      - key: SEED_ON_START
        value: "false" # only honoured with DATA_MODE=demo
      - key: SCHEDULER_ENABLED
        value: "true" # an advisory lock keeps it to one instance
      - key: ADMIN_TOKEN
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # e.g. https://justsport.vercel.app
      - key: API_TOKEN_SECRET
        sync: false # same value as the web app's API_TOKEN_SECRET (>= 32 characters)
      - key: FOOTBALL_DATA_API_KEY
        sync: false
      - key: THESPORTSDB_API_KEY
        sync: false # premium key only; the public dev key "123" is ignored in live mode
      - key: BALLDONTLIE_API_KEY
        sync: false
      # NEWS_FEEDS is deliberately not set: the built-in, terms-checked feed list is used.
      - key: LOG_LEVEL
        value: info
