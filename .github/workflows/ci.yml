name: CI

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: justsport
          POSTGRES_PASSWORD: justsport
          POSTGRES_DB: justsport
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U justsport" --health-interval 5s
          --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10
    env:
      USE_FIXTURES: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest --cov=app --cov-fail-under=70
      - name: Migrate and seed a real PostgreSQL (fixture mode)
        env:
          DATABASE_URL: postgresql+asyncpg://justsport:justsport@localhost:5432/justsport
          REDIS_URL: redis://localhost:6379/0
        run: |
          uv run alembic upgrade head
          uv run python -m app.scripts.seed
          uv run alembic upgrade head   # idempotent re-run

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
